<script>
  // Scroll reveal
  const revealEls = document.querySelectorAll('[data-reveal]');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:0.12});
  revealEls.forEach(el=>io.observe(el));

  // Click-to-detail
  const clickable = document.querySelectorAll('[data-detail]');
  const blocks = document.querySelectorAll('.detail-block');
  const empty = document.getElementById('detailEmpty');
  const hint = document.getElementById('detailsHint');

  const labels = {
    languages: '"6+ Languages & Tools" — full breakdown',
    projects: '"10 Projects Built" — every project, in full',
    spoken: '"3 Spoken Languages" — proficiency breakdown',
    education: '"Education" — full academic record',
    proj1: '"Attendance Management System" — full case study',
    proj2: '"Frequent Itemset Mining on Hadoop" — full case study',
    'cap-frontend': '"Frontend Engineering" — full details',
    'cap-backend': '"Backend & Languages" — full details',
    'cap-databases': '"Databases" — full details',
    'cap-bigdata': '"Data & Big Data" — full details',
    'cap-tools': '"Tools & Practice" — full details',
    'cap-api': '"APIs & Blockchain" — full details',
    'mini-1': '"Password Generator" — details',
    'mini-2': '"Email Sender Tool" — details',
    'mini-3': '"Temperature Converter" — details',
    'mini-4': '"Expense Tracker Application" — details',
    'mini-5': '"Word Game" — details',
    'mini-6': '"Rock Paper and Scissor Game" — details',
    'mini-7': '"Blockchain & Cryptocurrency System" — details',
    'mini-8': '"Python Blockchain API with FastAPI" — details'
  };

  function showDetail(key){
    blocks.forEach(b => b.classList.remove('active'));
    const target = document.getElementById('detail-' + key);
    if(target){
      target.classList.add('active');
      empty.style.display = 'none';
      hint.textContent = labels[key] || '';
    }
    clickable.forEach(el => {
      const isActive = el.dataset.detail === key;
      el.classList.toggle('active', isActive);
      if(el.hasAttribute('aria-expanded')) el.setAttribute('aria-expanded', isActive ? 'true' : 'false');
    });
    document.getElementById('details').scrollIntoView({behavior:'smooth', block:'start'});
  }

  clickable.forEach(el => {
    el.addEventListener('click', () => showDetail(el.dataset.detail));
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); showDetail(el.dataset.detail); }
    });
  });

  // Subtle tilt on capability/work cards
  document.querySelectorAll('.cap-card, .work-card').forEach(card=>{
    card.addEventListener('mousemove', (e)=>{
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left - r.width/2;
      const y = e.clientY - r.top - r.height/2;
      card.style.transform = `perspective(600px) rotateX(${(-y/18).toFixed(2)}deg) rotateY(${(x/18).toFixed(2)}deg) translateY(-2px)`;
    });
    card.addEventListener('mouseleave', ()=>{ card.style.transform = ''; });
  });
</script>

</body>
</html>
